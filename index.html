<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Analyzer — Area Riservata</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07070f; --bg2: #0f0f1a; --bg3: #161625; --bg4: #1e1e30;
  --accent: #7c6af7; --accent2: #f06292; --accent3: #26d7a0;
  --text: #eeeeff; --text2: #9d9bbf; --text3: #55536e;
  --border: rgba(124,106,247,0.15); --r: 12px; --r2: 18px;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* Login Overlay */
#login-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999;
}
.login-box {
  background: var(--bg2); padding: 40px; border-radius: var(--r2);
  border: 1px solid var(--border); text-align: center; width: 90%; max-width: 400px;
}
.input-group { margin-bottom: 18px; text-align: left; }
.input-group label { display: block; margin-bottom: 6px; font-size: 0.8rem; color: var(--text2); text-transform: uppercase; }
.input-group input, .input-group textarea {
  width: 100%; padding: 14px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--r); color: #fff; outline: none; transition: 0.3s;
}
.btn-primary {
  background: var(--accent); color: #fff; border: none; padding: 14px;
  border-radius: var(--r); cursor: pointer; font-weight: 700; width: 100%;
  text-transform: uppercase; transition: 0.3s;
}

/* Dashboard UI */
#main-dashboard { display: none; padding: 30px; max-width: 1300px; margin: 0 auto; }
.layout { display: grid; grid-template-columns: 380px 1fr; gap: 30px; }
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 25px; }
.job-card { background: var(--bg3); padding: 20px; border-radius: var(--r); margin-bottom: 15px; }

@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h2 style="font-family:'Syne'; margin-bottom:20px;">Marketing Analyzer</h2>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="user" placeholder="Username" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="pass" placeholder="Password">
    </div>
    <button class="btn-primary" onclick="handleLogin()">Accedi</button>
  </div>
</div>

<div id="main-dashboard">
  <header style="display:flex; justify-content:space-between; margin-bottom:40px;">
    <h1 style="font-family:'Syne';">Marketing Analyzer</h1>
    <button onclick="location.reload()" style="background:none; color:var(--text2); border:1px solid var(--text3); padding:5px 15px; border-radius:8px; cursor:pointer;">Logout</button>
  </header>
  <div class="layout">
    <aside class="panel">
      <h3 style="color:var(--accent); margin-bottom:20px;">Nuova Proposta</h3>
      <div class="input-group"><label>Titolo</label><input type="text" id="in-title"></div>
      <div class="input-group"><label>Azienda</label><input type="text" id="in-company"></div>
      <button class="btn-primary" onclick="addNewJob()">Salva</button>
    </aside>
    <main class="panel">
      <h3>Lista Opportunità</h3>
      <div id="job-feed"></div>
    </main>
  </div>
</div>

<!-- CARICAMENTO DEL FILE DI CONFIGURAZIONE ESTERNO -->
<script src="config.js"></script>

<script>
function handleLogin() {
    const u = document.getElementById('user').value.trim().toLowerCase();
    const p = document.getElementById('pass').value.trim();

    // AUTH_DB è definito nel file config.js
    if (typeof AUTH_DB !== 'undefined' && AUTH_DB[u] && AUTH_DB[u] === p) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
    } else {
        alert('Credenziali non valide o file di configurazione mancante.');
    }
}

function addNewJob() {
    const title = document.getElementById('in-title').value;
    const company = document.getElementById('in-company').value;
    if(!title || !company) return;
    const card = document.createElement('div');
    card.className = 'job-card';
    card.innerHTML = `<h4>${title}</h4><p style="color:var(--accent3)">${company}</p>`;
    document.getElementById('job-feed').prepend(card);
    document.getElementById('in-title').value = '';
    document.getElementById('in-company').value = '';
}
</script>
</body>
</html>
